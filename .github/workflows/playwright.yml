name: Playwright LMS Automation CI

on:
  workflow_dispatch: 
  push:
    branches: [ main, master, LMSAutomation_Capproject_main]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run All Tests (Combined HTML Report)
        run: pytest --html=reports/report.html --self-contained-html

      - name: Run UI Tests Only (Separate UI Report)
        if: always()
        run: pytest -m ui --html=reports/ui_report.html --self-contained-html

      - name: Run API Tests Only (Separate API Report)
        if: always()
        run: pytest -m api --html=reports/api_report.html --self-contained-html

      - name: Upload Reports, Screenshots & Traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            reports/
            screenshots/
            traces/
          retention-days: 14
